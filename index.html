<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="color-scheme" content="dark" />
    <title>共生之网 · Mycelia</title>
    <style>
      :root {
        --bg: #08090c;
        --panel: #101318;
        --panel-2: #161a21;
        --border: #232a35;
        --text: #d8dee9;
        --text-dim: #7b8798;
        --accent: #4ade80;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        /* 关键：单列也必须约束为 minmax(0,1fr)，否则内容会把根容器撑破，
           导致中间那栏的 1fr 在窄屏下被放大（实测 1280 宽下画布变成 1307px）。 */
        grid-template-columns: minmax(0, 1fr);
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
      }

      /* ---- 布局变量（手机竖屏会覆盖它）---- */
      :root {
        --app-cols: 268px minmax(0, 1fr) 316px;
      }

      /* ---- 手机竖屏布局（真实问题：390×844 下三栏 = 268+1fr+316 会把画布压成 0 宽）----
         竖屏改为「全屏画布 + 底部抽屉」：两个侧栏默认隐藏，由底部导航切换显示哪一个。
         横屏（>=900px）自动回到三栏。 */
      @media (max-width: 899px) {
        :root {
          --app-cols: minmax(0, 1fr);
        }
        main > aside {
          /* !important 是必需的：两个面板的根元素带内联 `display: flex`，
             普通规则压不过内联样式 —— 这是"抽屉关闭了但面板还在"的根因。 */
          display: none !important;
        }
        /* 手机上引导卡浮在画布上方：它的 DOM 挂在建造面板里，而那个面板被隐藏了 */
        .tutorial-card {
          position: fixed !important;
          left: 8px !important;
          right: 8px !important;
          top: max(8px, env(safe-area-inset-top)) !important;
          z-index: 25 !important;
          margin-bottom: 0 !important;
        }
        /* 底部导航：12 个按钮在 390px 宽下必然溢出（实测「挑战」在 x=424、「法则」在 x=471，
           完全在屏幕外点不到）。改为横向滚动 + 隐藏滚动条 —— 这是移动端的标准做法，
           比把功能收进"更多"菜单更直接，玩家一划就能看到全部入口。 */
        nav {
          overflow-x: auto !important;
          overflow-y: hidden !important;
          flex-wrap: nowrap !important;
          justify-content: flex-start !important;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
          padding-left: max(10px, env(safe-area-inset-left)) !important;
          padding-right: max(10px, env(safe-area-inset-right)) !important;
        }
        nav::-webkit-scrollbar {
          display: none;
        }
        nav > button {
          flex: 0 0 auto !important;
        }
        /* 模态框在手机上贴边显示，把有限的宽度让给内容 */
        [data-modal] {
          padding: 10px !important;
          align-items: center !important;
        }
        [data-modal] > div {
          border-radius: 12px !important;
        }
        body[data-drawer='build'] main > aside:first-of-type,
        body[data-drawer='inspector'] main > aside:last-of-type {
          /* 必须带 !important：上面那条 `main > aside { display: none !important }`
             优先级更高，否则抽屉永远打不开（真机反馈"点了没反应"就是这个）。 */
          display: flex !important;
          flex-direction: column;
          position: fixed;
          left: 0;
          right: 0;
          bottom: 52px;
          top: auto;
          width: 100% !important;
          max-height: 46vh;
          overflow-y: auto;
          border: 1px solid var(--border, #263041);
          border-radius: 12px 12px 0 0;
          box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.5);
          z-index: 30;
        }
        /* 抽屉打开时，底部导航之上的区域仍可操作画布 */
        body[data-drawer] canvas {
          touch-action: none;
        }
        /* 触控目标放大：手指比鼠标粗得多 */
        button {
          min-height: 34px;
        }
        nav button {
          min-height: 44px;
          font-size: 13px !important;
        }
      }
      /* 触控设备上禁用长按选择与双击缩放（否则会跟游戏手势打架） */
      canvas {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* ---- 交互反馈（反馈 #2：按钮点击"绵软无力"）----
         三态 + 点击回弹，全部走 CSS，零 JS 开销；内联样式只负责配色，不与此冲突。 */
      button {
        transition:
          transform 90ms ease,
          filter 120ms ease,
          border-color 120ms ease,
          background 120ms ease,
          box-shadow 120ms ease;
        will-change: transform;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.22);
        border-color: #38414f;
      }
      button:active:not(:disabled) {
        transform: scale(0.96);
        filter: brightness(0.94);
        box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.55);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button:focus-visible {
        outline: 2px solid #4ade80;
        outline-offset: 1px;
      }

      /* 购买/解锁成功时的确认脉冲（由 ui/dom.ts 的 pulse() 触发） */
      @keyframes mycelia-pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.55);
        }
        100% {
          box-shadow: 0 0 0 18px rgba(74, 222, 128, 0);
        }
      }
      .pulse-ok {
        animation: mycelia-pulse 520ms ease-out;
      }
      @keyframes mycelia-shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-3px);
        }
        75% {
          transform: translateX(3px);
        }
      }
      .pulse-fail {
        animation: mycelia-shake 260ms ease-in-out;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
        .pulse-ok,
        .pulse-fail {
          animation: none;
        }
      }

      /* 新手引导的目标元素高亮（反馈 #3） */
      @keyframes guide-glow {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.55);
          border-color: #4ade80;
        }
        50% {
          box-shadow: 0 0 0 7px rgba(74, 222, 128, 0);
          border-color: #86efac;
        }
      }
      .guide-focus {
        animation: guide-glow 1.5s ease-in-out infinite;
        position: relative;
        z-index: 5;
      }
      @media (prefers-reduced-motion: reduce) {
        .guide-focus {
          animation: none;
          border-color: #4ade80;
        }
      }
      /* 首次渲染前的骨架，避免白屏闪烁 */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--text-dim);
        font-size: 14px;
        letter-spacing: 0.2em;
      }
    </style>
  </head>
  <body>
    <div id="boot">孢子正在萌发…</div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
